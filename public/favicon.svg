<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="avatar">
      <circle cx="256" cy="256" r="252" />
    </clipPath>
  </defs>
  <rect width="512" height="512" fill="#0f1115" />
  <image
    href="/favicon-photo.jpg"
    width="512"
    height="512"
    preserveAspectRatio="xMidYMid slice"
    clip-path="url(#avatar)"
  />
</svg>
